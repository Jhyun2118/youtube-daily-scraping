name: Link Timing Tracker

# 2026-11-03: 맥에서 돌던 링크카드 부착 시점 추적기(track_link_timing.py)를 출장 동안 클라우드로 옮김.
# 2시간마다 B2의 link_timing_tracker.db를 받아 100분 이어 돌리고 다시 올린다.
# 추적이 끝나면(meta done) 스크립트가 바로 끝난다. 11/12 이후 이 workflow는 비활성화할 것.
on:
  schedule:
    - cron: '10 */2 * * *'
  workflow_dispatch:

concurrency:
  group: link-timing-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      actions: write
      contents: read
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
      YOUTUBE_DB_DIR: /home/runner/youtube_daily_db
      TRACKER_DB: /home/runner/youtube_daily_db/link_timing_tracker.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r scraper/requirements.txt
      - name: Download tracker DB
        run: |
          mkdir -p "$YOUTUBE_DB_DIR"
          # B2에 아직 DB가 없으면(맥에서 올리기 전) 이번 실행은 건너뛴다
          python3 scraper/b2_sync.py get link_timing_tracker.db "$TRACKER_DB" || { [ $? -eq 3 ] && echo "tracker DB not on B2 yet, skipping"; }
      - name: Run tracker
        run: |
          test -f "$TRACKER_DB" || exit 0
          cd scraper
          python3 track_link_timing_cloud.py --max-minutes 100
        continue-on-error: true
      - name: Upload tracker DB
        if: always()
        run: |
          test -f "$TRACKER_DB" && python3 scraper/b2_sync.py put link_timing_tracker.db "$TRACKER_DB"
      # 새 workflow의 schedule이 몇 시간씩 안 뜨는 일이 있어(11/03 실측) 끝나면 다음 실행을 직접 건다.
      # 추적이 끝나면(meta done) 걸지 않는다. concurrency로 동시에 하나만 돈다.
      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "$TRACKER_DB" || exit 0
          done=$(python3 -c "import sqlite3,os; c=sqlite3.connect(os.environ['TRACKER_DB']); print(1 if c.execute(\"SELECT 1 FROM meta WHERE k='done'\").fetchone() else 0)")
          if [ "$done" = "0" ]; then gh workflow run link-timing-tracker.yml --repo "${{ github.repository }}"; echo "next run dispatched"; else echo "tracker done, not chaining"; fi
